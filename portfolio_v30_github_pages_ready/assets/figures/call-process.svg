<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="674" viewBox="0 0 1120 674"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial, sans-serif;fill:#193657}.hd{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#5a7189}.l{font-size:24px;font-weight:700}.s{font-size:21px;fill:#42586e}</style><text x="52" y="58" class="hd">CALL | 데이터 활용 흐름</text><text x="52" y="96" class="sub">연구 과정과 평가의 연결 관계를 재구성함</text><rect x="52" y="130" width="1016" height="108" rx="16" fill="#eef6ff" stroke="#d9e7f4"/><circle cx="103" cy="184" r="29" fill="#1768d0"/><text x="94" y="193" style="font-size:24px;fill:#fff;font-weight:bold">1</text><text x="157" y="175" class="l">커뮤니티 게시글 수집</text><text x="157" y="209" class="s">주제별 게시글과 의견을 수집 및 선별함</text><rect x="52" y="256" width="1016" height="108" rx="16" fill="#f5f9fd" stroke="#d9e7f4"/><circle cx="103" cy="310" r="29" fill="#1768d0"/><text x="94" y="319" style="font-size:24px;fill:#fff;font-weight:bold">2</text><text x="157" y="301" class="l">핵심 의견 추출</text><text x="157" y="335" class="s">LLM으로 공통 논점과 관점 정보를 구조화함</text><rect x="52" y="382" width="1016" height="108" rx="16" fill="#eef6ff" stroke="#d9e7f4"/><circle cx="103" cy="436" r="29" fill="#1768d0"/><text x="94" y="445" style="font-size:24px;fill:#fff;font-weight:bold">3</text><text x="157" y="427" class="l">커뮤니티 에이전트 구성</text><text x="157" y="461" class="s">추출된 근거를 활용해 응답을 생성함</text><rect x="52" y="508" width="1016" height="108" rx="16" fill="#f5f9fd" stroke="#d9e7f4"/><circle cx="103" cy="562" r="29" fill="#1768d0"/><text x="94" y="571" style="font-size:24px;fill:#fff;font-weight:bold">4</text><text x="157" y="553" class="l">평가</text><text x="157" y="587" class="s">Opinion Consistency 및 Value Alignment를 검증함</text></svg>