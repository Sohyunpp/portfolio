<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="674" viewBox="0 0 1120 674"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial, sans-serif;fill:#193657}.hd{font-size:34px;font-weight:700}.sub{font-size:22px;fill:#5a7189}.l{font-size:24px;font-weight:700}.s{font-size:21px;fill:#42586e}</style><text x="52" y="58" class="hd">TTA | 범용 AI 위험관리 흐름</text><text x="52" y="96" class="sub">TTA 연구의 관리 절차를 이해하기 쉽게 재구성함</text><rect x="52" y="130" width="1016" height="108" rx="16" fill="#eef6ff" stroke="#d9e7f4"/><circle cx="103" cy="184" r="29" fill="#1768d0"/><text x="94" y="193" style="font-size:24px;fill:#fff;font-weight:bold">1</text><text x="157" y="175" class="l">위험 식별</text><text x="157" y="209" class="s">서비스와 사용 환경에서 위험요소를 목록화함</text><rect x="52" y="256" width="1016" height="108" rx="16" fill="#f5f9fd" stroke="#d9e7f4"/><circle cx="103" cy="310" r="29" fill="#1768d0"/><text x="94" y="319" style="font-size:24px;fill:#fff;font-weight:bold">2</text><text x="157" y="301" class="l">위험 분석</text><text x="157" y="335" class="s">발생 가능성, 영향과 원인을 분석함</text><rect x="52" y="382" width="1016" height="108" rx="16" fill="#eef6ff" stroke="#d9e7f4"/><circle cx="103" cy="436" r="29" fill="#1768d0"/><text x="94" y="445" style="font-size:24px;fill:#fff;font-weight:bold">3</text><text x="157" y="427" class="l">위험 평가</text><text x="157" y="461" class="s">중요도와 대응 우선순위를 판단함</text><rect x="52" y="508" width="1016" height="108" rx="16" fill="#f5f9fd" stroke="#d9e7f4"/><circle cx="103" cy="562" r="29" fill="#1768d0"/><text x="94" y="571" style="font-size:24px;fill:#fff;font-weight:bold">4</text><text x="157" y="553" class="l">위험 대응 및 점검</text><text x="157" y="587" class="s">관리 조치를 수립하고 운영 중 추적함</text></svg>