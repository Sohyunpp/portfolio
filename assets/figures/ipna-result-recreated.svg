<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><rect width="1100" height="470" rx="20" fill="#f8fbff"/><text x="40" y="61" font-size="30" fill="#14385e" font-family="DejaVu Sans,sans-serif" font-weight="bold">사용자 인식 평가: 통계적으로 유의한 차이</text><text x="40" y="107" font-size="20" fill="#526881" font-family="DejaVu Sans,sans-serif">평가 집단의 정치 성향에 따라 선호 이미지 유형이 달라짐</text><rect x="45" y="145" width="490" height="250" rx="17" fill="white" stroke="#d8e7f5" stroke-width="2"/><text x="70" y="198" fill="#193a63" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">편향적 보도</text><text x="70" y="258" fill="#1768d0" font-family="Arial,sans-serif" font-size="35" font-weight="bold">χ² = 7.66</text><text x="70" y="316" fill="#244b7e" font-family="Arial,sans-serif" font-size="30">p = 0.022</text><text x="70" y="359" fill="#61738a" font-family="DejaVu Sans,sans-serif" font-size="19">기사 유형별 이미지 선호도 차이</text><rect x="560" y="145" width="490" height="250" rx="17" fill="white" stroke="#d8e7f5" stroke-width="2"/><text x="585" y="198" fill="#193a63" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold">사실 보도</text><text x="585" y="258" fill="#1768d0" font-family="Arial,sans-serif" font-size="35" font-weight="bold">χ² = 9.10</text><text x="585" y="316" fill="#244b7e" font-family="Arial,sans-serif" font-size="30">p = 0.011</text><text x="585" y="359" fill="#61738a" font-family="DejaVu Sans,sans-serif" font-size="19">기사 유형별 이미지 선호도 차이</text></svg>